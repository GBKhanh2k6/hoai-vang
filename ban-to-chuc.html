<body data-page="ban-to-chuc">
<main id="main">
  <section class="page-hero page-hero--left">
    <div class="drum"></div>
    <div class="wrap split">
      <div class="stack">
        <img src="assets/brand/logo.png" width="280" alt="Checkmate Group">
        <h1>Ban tổ chức</h1>
        <p class="lead">Những người trẻ cùng chung một mong muốn: để thầy cô có một buổi chiều thật ấm và thật đáng nhớ.</p>
        <a class="btn" href="#thanh-vien">Gặp các thành viên</a>
      </div>
      <figure class="frame notch photo-wide"><img width="1800" height="1200" src="assets/template/ban-to-chuc.jpg" alt="Ban tổ chức cùng cô An Phương"></figure>
    </div>
    <div class="waves waves--edge"></div>
  </section>

  <section class="section" id="thanh-vien">
    <div class="wrap">
      <h2 class="title intro" data-split>Gương mặt Checkmate Group</h2>
      <div class="people">
        <figure id="nam-phuong" class="person glass" data-tilt><img decoding="async" loading="lazy" width="1600" height="1062" src="assets/photos/l/9058.jpg" style="object-position:50% center" alt="Nam Phương"><figcaption><strong>Nam Phương</strong>Ban tổ chức</figcaption></figure>
        <figure id="anh-kiet" class="person glass" data-tilt><img decoding="async" loading="lazy" width="800" height="1000" src="assets/template/anh-kiet.jpg" alt="Anh Kiệt"><figcaption><strong>Anh Kiệt</strong>Ban tổ chức</figcaption></figure>
        <figure id="quynh-anh" class="person glass" data-tilt><img decoding="async" loading="lazy" width="1600" height="1062" src="assets/photos/l/8929.jpg" style="object-position:34% center" alt="Quỳnh Anh"><figcaption><strong>Quỳnh Anh</strong>Ban tổ chức</figcaption></figure>
        <figure id="thien-trang" class="person glass" data-tilt><img decoding="async" loading="lazy" width="1600" height="1062" src="assets/photos/l/9123.jpg" style="object-position:28% center" alt="Thiên Trang"><figcaption><strong>Thiên Trang</strong>Ban tổ chức</figcaption></figure>
        <figure id="minh-thu" class="person glass" data-tilt><img decoding="async" loading="lazy" width="1600" height="1062" src="assets/photos/l/8921.jpg" style="object-position:43% center" alt="Minh Thư"><figcaption><strong>Minh Thư</strong>Ban tổ chức</figcaption></figure>
        <figure id="anh-thu" class="person glass" data-tilt><img decoding="async" loading="lazy" width="1600" height="1062" src="assets/photos/l/8927.jpg" style="object-position:30% center" alt="Anh Thư"><figcaption><strong>Anh Thư</strong>Ban tổ chức</figcaption></figure>
      </div>
    </div>
  </section>
</main>
